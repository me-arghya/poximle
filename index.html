<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Setlingo · Romanian → English</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');
:root{--blue:#00c8ff;--teal:#00ffd5;--green:#39ff14;--yellow:#ffe600;--red:#ff4757;--bg:#020c18;--card:rgba(0,20,45,.7);--dim:rgba(0,200,255,.18);--txt:#e8f4ff;--mute:rgba(180,215,255,.6);--font:'Inter',system-ui,sans-serif;--mono:'Share Tech Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);background-image:radial-gradient(ellipse 90% 50% at 50% 0%,rgba(0,50,95,.9),transparent);color:var(--txt)}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 12px rgba(0,200,255,.3)}
.name{font:20px var(--mono);color:var(--blue);letter-spacing:2px;line-height:1}
.sub{font-size:10px;color:var(--mute);letter-spacing:2px;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px}
.chip.on{border-color:var(--teal);color:var(--teal);background:rgba(0,255,213,.12);box-shadow:0 0 12px rgba(0,255,213,.25)}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--dim);background:var(--card);color:var(--blue);font:600 12px var(--font);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip.hide{display:none}
.chip input{display:none}

.status{margin:0 16px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--dim);background:var(--card);font:11.5px var(--mono);color:var(--mute);min-height:36px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex-shrink:0}
.status.recording{border-color:rgba(57,255,20,.35);color:var(--green)}
.status.recording .dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1s infinite}
.status.error{border-color:rgba(255,71,87,.45);color:#ffb3ba}.status.error .dot{background:var(--red)}
.status.done{color:var(--blue)}
.timer{margin-left:auto;letter-spacing:1px}


.panes{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:6px 16px 10px}
.pane{display:flex;flex-direction:column;min-height:0}
.pane.en{flex:3}.pane.ro{flex:2}
.lab{display:flex;justify-content:space-between;font:10px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.lab b{color:var(--blue);font-weight:400}
textarea{flex:1;min-height:0;width:100%;resize:none;background:var(--card);border:1.5px solid var(--dim);border-radius:14px;padding:12px 14px;font:16px/1.55 var(--font);color:var(--txt);outline:none}
.pane.ro textarea{font-size:15px;color:rgba(200,225,255,.8)}
textarea::placeholder{color:rgba(120,170,210,.4)}
textarea.live{border-color:rgba(57,255,20,.4)}

.bar{display:flex;align-items:center;justify-content:space-around;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--dim);background:rgba(2,12,28,.92)}
.side{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--mute);font:600 11px var(--font);cursor:pointer;padding:6px 0}
.side span{font-size:20px}
.side:disabled{opacity:.35}
.mic{width:78px;height:78px;border-radius:50%;border:2px solid var(--blue);background:rgba(0,200,255,.1);color:var(--blue);font-size:32px;cursor:pointer;box-shadow:0 0 22px rgba(0,200,255,.35);transition:.2s}
.mic.on{border-color:var(--red);color:var(--red);background:rgba(255,71,87,.12);animation:pulse 1.6s infinite}
.mic:disabled{opacity:.35}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(255,71,87,.4)}50%{box-shadow:0 0 34px rgba(255,71,87,.8)}}
@keyframes blink{50%{opacity:.3}}
@media(min-width:700px){.app{max-width:520px;margin:0 auto;border-left:1px solid var(--dim);border-right:1px solid var(--dim)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">🎤</div><div><div class="name">SETLINGO</div><div class="sub">RO → EN</div></div></div>
  </div>
  <div class="chips">
    <label class="chip" id="bgChip">🎵 Background mode<input type="checkbox" id="bgToggle" onchange="bgChange()"></label>
    <label class="chip">📁 Upload<input type="file" id="file" accept=".txt,.docx,.pdf" onchange="uploadFile(this)"></label>
    <button class="chip hide" id="btnDl" onclick="download()">⬇ Save</button>
  </div>

  <div class="status" id="status"><div class="dot"></div><span id="statusText">Tap the mic and speak Romanian.</span><span class="timer" id="timer" style="display:none">00:00</span></div>

  <div class="panes">
    <div class="pane en">
      <div class="lab"><span>🇬🇧 English</span><span>Words <b id="wc">0</b></span></div>
      <textarea id="english" placeholder="English translation appears here…"></textarea>
    </div>
    <div class="pane ro">
      <div class="lab"><span>🇷🇴 Romanian (as heard)</span></div>
      <textarea id="original" placeholder="Romanian text appears here…"></textarea>
    </div>
  </div>

  <div class="bar">
    <button class="side" id="btnClr" onclick="clearAll()"><span>🗑</span>Clear</button>
    <button class="mic" id="btnMic" onclick="toggleRec()" aria-label="Start or stop listening">🎤</button>
    <button class="side" id="btnCopy" onclick="copyEnglish()"><span>📋</span>Copy</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
let rec = null, on = false, running = false, tInt = null, secs = 0, watchdog = null, wake = null;
let queue = [], busy = false, lastN = '', lastT = 0;
let engine = 'browser';

/* ---------- translation (free Google endpoint, with retry) ---------- */
async function translate(text, tries = 3) {
  text = (text || '').trim();
  if (!text) return '';
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ro&tl=en&dt=t&q=' + encodeURIComponent(text));
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const out = d[0].map(c => c[0]).filter(Boolean).join('').trim();
      if (out) return out;
    } catch (_) { await new Promise(r => setTimeout(r, 400 * (i + 1))); }
  }
  return '[translation unavailable] ' + text;
}
async function translateLong(text) {
  const parts = []; let cur = '';
  for (const s of text.split(/(?<=[.!?\n])\s+/)) {
    if ((cur + ' ' + s).length > 1800) { if (cur) parts.push(cur); cur = s; } else cur += (cur ? ' ' : '') + s;
  }
  if (cur) parts.push(cur);
  let out = '';
  for (let i = 0; i < parts.length; i++) {
    status('', `🌐 Translating… ${i + 1}/${parts.length}`);
    out += (out ? ' ' : '') + await translate(parts[i]);
  }
  return out;
}

/* ---------- duplicate guard (fixes repeated words on phones) ---------- */
const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu, '').replace(/\s+/g, ' ').trim();
function commit(t) {
  t = (t || '').trim(); if (!t) return;
  const n = norm(t), now = Date.now(), recent = now - lastT < 5000;
  if (!n) return;
  if (recent && n === lastN) return;                       // exact repeat
  if (recent && lastN && n.startsWith(lastN + ' ')) {      // repeat + new words → keep only the new words
    t = t.split(/\s+/).slice(lastN.split(' ').length).join(' ');
    if (!t.trim()) return;
  }
  lastN = n; lastT = now;
  queue.push(t); drain();
}

/* ---------- recognition ---------- */
function buildRec() {
  const r = new SR();
  r.lang = 'ro-RO';
  r.continuous = !MOBILE;          // phones: one phrase per cycle, restarted automatically (no repeat bug)
  r.interimResults = true; r.maxAlternatives = 1;
  r._done = 0; r._committed = false; r._interim = '';
  r.onstart = () => { running = true; if (on) status('recording', 'Listening… speak Romanian'); };
  r.onresult = e => {
    let interim = '';
    for (let i = 0; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      if (e.results[i].isFinal) {
        if (i >= r._done) { r._done = i + 1; r._committed = true; commit(t); }   // each final handled once
      } else interim += ' ' + t;
    }
    r._interim = interim.trim();
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopRec(); status('error', '⚠ Microphone blocked — allow mic access for this site and try again.'); }
    else if (e.error === 'audio-capture') { stopRec(); status('error', '⚠ No microphone found.'); }
    else if (e.error === 'network') status('error', '⚠ Network problem — reconnecting…');
  };
  r.onend = () => {
    running = false;
    if (!r._committed && r._interim) commit(r._interim);   // save half-heard phrase only if no final arrived
    if (on) restartSoon();
  };
  return r;
}
function restartSoon() {
  setTimeout(() => {
    if (!on || running) return;
    try { rec = buildRec(); rec.start(); } catch (_) { running = false; }
  }, MOBILE ? 350 : 250);
}

async function drain() {
  if (busy) return; busy = true;
  while (queue.length) {
    const ro = queue.shift();
    appendTo('original', ro);
    appendTo('english', await translate(ro));
    stats();
  }
  busy = false;
}
function appendTo(id, text) {
  const b = $(id);
  b.value += (b.value.trim() ? ' ' : '') + text;
  b.scrollTop = b.scrollHeight;
}

async function startRec() {
  if (!SR) { status('error', '⚠ This browser has no speech recognition. Open in Chrome (Android) or Edge. iPhone Safari is not supported.'); return; }
  if (on) return;
  if ($('bgToggle').checked) return startWhisper();
  engine = 'browser';
  queue = []; on = true; running = false; lastN = ''; lastT = 0;
  rec = buildRec();
  try { rec.start(); } catch (e) { status('error', '⚠ ' + e.message); on = false; return; }
  clearInterval(watchdog);
  watchdog = setInterval(() => { if (on && !running) restartSoon(); }, 3000);
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  ui(true); startTimer();
  status('recording', 'Listening… speak Romanian');
}
async function stopRec() {
  if (!on) return;
  if (engine === 'whisper') return stopWhisper();
  on = false; clearInterval(watchdog);
  if (rec) { const r = rec; r.onend = null; try { r.stop(); } catch (_) {} if (!r._committed && r._interim) commit(r._interim); }
  try { if (wake) { wake.release(); wake = null; } } catch (_) {}
  clearInterval(tInt);
  status('', '🌐 Finishing…');
  await new Promise(r => setTimeout(r, 600));
  while (busy || queue.length) { drain(); await new Promise(r => setTimeout(r, 200)); }
  stats(); ui(false);
  status('done', `Done · ${$('timer').textContent} · ${wordsOf($('english').value)} words`);
  if ($('english').value.trim()) $('btnDl').classList.remove('hide');
}
/* ---------- Background mode: Whisper speech model running inside the phone (free, no key) ---------- */
const W = { pipe: null, loading: null, ctx: null, stream: null, proc: null, buf: [], timer: null, q: Promise.resolve() };
const W_RATE = 16000, W_CHUNK_MS = 8000;
const JUNK = /(mul[țtţ]umesc|multumesc)\s+pentru\s+(vizionare|urm[ăa]rire)|subtitrare|abona[țtţ]i-v[ăa]|thanks for watching|subtitles? by|amara\.org|www\./i;

function loadWhisper() {
  if (W.pipe) return Promise.resolve(W.pipe);
  if (!W.loading) W.loading = (async () => {
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    env.allowLocalModels = false;
    W.pipe = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', {
      progress_callback: p => { if (p.status === 'progress' && p.progress) status('recording', `⬇ Downloading speech model… ${Math.round(p.progress)}% (one time only)`); }
    });
    return W.pipe;
  })().catch(e => { W.loading = null; throw e; });
  return W.loading;
}
function resample(data, from, to) {
  if (from === to) return data;
  const ratio = from / to, n = Math.floor(data.length / ratio), out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const p = i * ratio, a = Math.floor(p), b = Math.min(a + 1, data.length - 1); out[i] = data[a] + (data[b] - data[a]) * (p - a); }
  return out;
}
async function startWhisper() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { status('error', '⚠ This browser cannot record audio.'); return; }
  engine = 'whisper'; on = true; queue = []; lastN = ''; lastT = 0; W.buf = [];
  ui(true); $('bgToggle').disabled = true;
  status('recording', '⬇ Loading speech model… (first time takes a minute)');
  try { await loadWhisper(); }
  catch (e) { on = false; ui(false); $('bgToggle').disabled = false; status('error', '⚠ Could not load the speech model — check internet and try again.'); return; }
  if (!on) return;
  try {
    /* all filtering OFF so music and background audio reach the model */
    W.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const AC = window.AudioContext || window.webkitAudioContext;
    try { W.ctx = new AC({ sampleRate: W_RATE }); } catch (_) { W.ctx = new AC(); }
    if (W.ctx.state === 'suspended') await W.ctx.resume();
    const src = W.ctx.createMediaStreamSource(W.stream);
    W.proc = W.ctx.createScriptProcessor(4096, 1, 1);
    const mute = W.ctx.createGain(); mute.gain.value = 0;
    W.proc.onaudioprocess = e => { if (on) W.buf.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(W.proc); W.proc.connect(mute); mute.connect(W.ctx.destination);
  } catch (e) {
    on = false; ui(false); $('bgToggle').disabled = false;
    status('error', '⚠ Microphone blocked — allow mic access for this site and try again.'); return;
  }
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  startTimer();
  status('recording', '🎵 Background mode — listening to everything around you…');
  W.timer = setInterval(flushChunk, W_CHUNK_MS);
}
function flushChunk() {
  if (!W.buf.length) return;
  let len = 0; W.buf.forEach(b => len += b.length);
  const all = new Float32Array(len); let o = 0; W.buf.forEach(b => { all.set(b, o); o += b.length; }); W.buf = [];
  let sum = 0; for (let i = 0; i < all.length; i += 8) sum += all[i] * all[i];
  if (Math.sqrt(sum / (all.length / 8)) < 0.004) return;               // silence → skip
  const audio = resample(all, W.ctx.sampleRate, W_RATE);
  W.q = W.q.then(async () => {
    try {
      const out = await W.pipe(audio, { language: 'romanian', task: 'transcribe' });
      const t = (out && out.text || '').trim();
      if (t && !(t.length < 90 && JUNK.test(t))) commit(t);
    } catch (_) {}
  });
}
async function stopWhisper() {
  on = false; clearInterval(W.timer); clearInterval(tInt);
  flushChunk();
  try { if (W.proc) { W.proc.onaudioprocess = null; W.proc.disconnect(); } } catch (_) {}
  try { if (W.stream) W.stream.getTracks().forEach(t => t.stop()); } catch (_) {}
  try { if (W.ctx) W.ctx.close(); } catch (_) {}
  W.proc = W.stream = W.ctx = null;
  try { if (wake) { wake.release(); wake = null; } } catch (_) {}
  status('', '🌐 Finishing last part…');
  try { await W.q; } catch (_) {}
  await new Promise(r => setTimeout(r, 300));
  while (busy || queue.length) { drain(); await new Promise(r => setTimeout(r, 200)); }
  stats(); ui(false); $('bgToggle').disabled = false;
  status('done', `Done · ${$('timer').textContent} · ${wordsOf($('english').value)} words`);
  if ($('english').value.trim()) $('btnDl').classList.remove('hide');
}
function bgChange() {
  const c = $('bgToggle').checked;
  $('bgChip').classList.toggle('on', c);
  status('', c ? '🎵 Background mode: hears music & device audio. Slower — text appears every ~10 seconds.' : 'Normal mode: fast, best for one person speaking close to the phone.');
  if (c) loadWhisper().catch(() => {});   // start downloading the model right away
}

function toggleRec() { on ? stopRec() : startRec(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && on && !running) restartSoon(); });

/* ---------- ui helpers ---------- */
function ui(rec) {
  $('btnMic').classList.toggle('on', rec); $('btnMic').textContent = rec ? '⏹' : '🎤';
  $('btnClr').disabled = rec;
  ['original', 'english'].forEach(i => $(i).classList.toggle('live', rec));
  if (rec) $('btnDl').classList.add('hide');
}
function status(type, msg) { $('status').className = 'status' + (type ? ' ' + type : ''); $('statusText').textContent = msg; }
function startTimer() {
  secs = 0; $('timer').style.display = 'inline'; $('timer').textContent = '00:00';
  clearInterval(tInt);
  tInt = setInterval(() => {
    secs++;
    $('timer').textContent = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
  }, 1000);
}
const wordsOf = t => (t.trim() ? t.trim().split(/\s+/).length : 0);
function stats() { $('wc').textContent = wordsOf($('english').value); }
function clearAll() {
  if (on) return;
  $('original').value = ''; $('english').value = '';
  $('btnDl').classList.add('hide'); $('timer').style.display = 'none'; stats(); status('', 'Cleared. Tap the mic and speak Romanian.');
}
async function copyEnglish() {
  const t = $('english').value.trim(); if (!t) return;
  try { await navigator.clipboard.writeText(t); status('done', '✓ English text copied'); }
  catch (_) { const e = $('english'); e.select(); document.execCommand('copy'); status('done', '✓ English text copied'); }
}
function download() {
  const en = $('english').value.trim(), ro = $('original').value.trim();
  if (!en && !ro) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([`=== ENGLISH ===\n${en}\n\n=== ROMANIAN ===\n${ro}\n`], { type: 'text/plain;charset=utf-8' }));
  a.download = `setlingo_${new Date().toISOString().slice(0, 10)}.txt`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('english').addEventListener('input', stats);

/* ---------- document upload ---------- */
async function finishDoc(ro, label) {
  const o = $('original'), e = $('english');
  o.value += (o.value.trim() ? '\n\n' : '') + ro;
  const en = await translateLong(ro);
  e.value += (e.value.trim() ? '\n\n' : '') + en;
  stats(); status('done', label); $('btnDl').classList.remove('hide');
}
function uploadFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const n = f.name.toLowerCase(), rd = new FileReader();
  status('recording', 'Reading ' + f.name + '…');
  if (n.endsWith('.txt')) { rd.onload = e => finishDoc(e.target.result.trim(), 'Translated: ' + f.name); rd.readAsText(f); }
  else if (n.endsWith('.docx')) {
    rd.onload = async e => { try { const r = await mammoth.extractRawText({ arrayBuffer: e.target.result }); finishDoc(r.value.trim(), 'Translated: ' + f.name); } catch (er) { status('error', 'DOCX failed — ' + er.message); } };
    rd.readAsArrayBuffer(f);
  } else if (n.endsWith('.pdf')) {
    rd.onload = async e => {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
        let t = '';
        for (let i = 1; i <= pdf.numPages; i++) { const c = await (await pdf.getPage(i)).getTextContent(); t += c.items.map(x => x.str).join(' ') + '\n'; }
        finishDoc(t.trim(), 'Translated: ' + f.name);
      } catch (er) { status('error', 'PDF failed — ' + er.message); }
    };
    rd.readAsArrayBuffer(f);
  } else status('error', 'Use .txt, .docx or .pdf');
  inp.value = '';
}

if (!SR) { $('btnMic').disabled = true; status('error', '⚠ No speech recognition in this browser. Use Chrome on Android (iPhone Safari is not supported). You can still upload documents.'); }
</script>
</body>
</html>
